name: Request indexing

# Notifies Google (Indexing API + sitemap resubmission) and IndexNow (Bing, Yandex...)
# about every URL in the live sitemap.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:

concurrency:
  group: request-indexing
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # After a push, give Vercel time to deploy the new version before pinging.
      - name: Wait for production deploy
        if: github.event_name == 'push'
        run: sleep 240

      - name: Notify search engines
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/request-indexing.mjs
